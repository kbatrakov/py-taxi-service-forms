{% extends 'base.html' %}
{% block content %}
  <h1>Delete Car</h1>

  <p>Are You sure You want to delete selected car: {{ car }}?</p>
  <p><i>All manufacturers connected with this car will also be deleted</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="{% url 'taxi:car-list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>

{% endblock %}
